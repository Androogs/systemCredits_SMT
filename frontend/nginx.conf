# SPA + reverse proxy al backend (mismo origen → sin CORS).
# La app React hace llamadas relativas a /api; nginx las reenvía al
# contenedor `api` por la red interna de docker-compose.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Evidencias: videos hasta EVIDENCIA_MAX_MB (25 MB) + margen.
    client_max_body_size 30m;

    # API + docs de FastAPI (Swagger en /api-docs, ReDoc en /redoc).
    location ~ ^/(api|api-docs|redoc) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las llamadas a DataCrédito (buró) pueden tardar ~60 s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Assets con hash de Vite: caché agresiva.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta del cliente cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
