name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + auditoría pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Tests (SQLite en memoria; no requiere Postgres)
        run: python -m pytest tests -q

      # Auditoría de dependencias (D171): reporta CVEs sin bloquear el build.
      - name: Auditoría de dependencias (pip-audit)
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  frontend:
    name: Frontend (tsc + lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      # Auditoría de dependencias (D171): solo bloquea en CVEs altos/críticos.
      - name: Auditoría de dependencias (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t creditos-api .
